name: macos

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  macos:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: macos
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      # Takes the version of the newest release, which the android-apk run for
      # the same push publishes.
      - name: Set version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          n=${tag##*.}
          echo "APP_VERSION=1.0.$n" >> "$GITHUB_ENV"
          perl -pi -e "s/^version: .*/version: 1.0.$n+$((2026200000 + n))/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | shasum -a 256 -c -

      - name: Build disk image
        run: dart setup.dart macos --env stable -v

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: ./dist/**/*.dmg
          if-no-files-found: error

      # Left out of SHA256SUMS, which the Windows job rewrites at the same time;
      # a Mac does not update itself from the release.
      - name: Add to the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$APP_VERSION"
          for _ in $(seq 60); do
            gh release view "$tag" > /dev/null 2>&1 && break
            sleep 30
          done
          find dist -name '*.dmg' -exec gh release upload "$tag" {} --clobber \;
