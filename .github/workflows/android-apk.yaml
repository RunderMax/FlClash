name: android-apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Without this secret the APK falls back to a debug key that changes on
      # every runner, so each new build must be uninstalled before installing.
      - name: Setup Android signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_PASSWORD != ''
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/app/keystore.jks.enc -out android/app/keystore.jks \
            -pass env:KEYSTORE_PASSWORD
          {
            echo "keyAlias=sloth"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      # The in-app updater only offers a release whose tag is newer than the installed
      # version, and Android refuses a lower versionCode than the 0.9.3 build carried.
      - name: Set version
        run: |
          n=${{ github.run_number }}
          echo "APP_VERSION=1.0.$n" >> "$GITHUB_ENV"
          sed -i "s/^version: .*/version: 1.0.$n+$((2026200000 + n))/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch CA certificates
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart setup.dart android --env stable --arch arm64 -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: ./dist/**/*.apk
          if-no-files-found: error

      - name: Publish release
        if: env.KEYSTORE_PASSWORD != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$APP_VERSION"
          mkdir release
          find dist -name '*.apk' -exec cp {} release/ \;
          (cd release && sha256sum *.apk > SHA256SUMS)
          git log -1 --format='- %s' > notes.md
          gh release create "$tag" release/* --title "Sloth Clash $APP_VERSION" \
            --notes-file notes.md --latest
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
